<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MyBlog</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #212529, #495057);
            font-family: Arial, sans-serif;
        }

        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 15px;
        }

        .login-card {
            width: 100%;
            max-width: 430px;
            background: white;
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
        }

        .logo {
            width: 70px;
            height: 70px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #212529;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
        }

        .login-title {
            font-weight: bold;
            color: #212529;
        }

        .login-subtitle {
            color: #6c757d;
            font-size: 14px;
        }

        .form-control {
            height: 48px;
            border-radius: 10px;
        }

        .form-control:focus {
            border-color: #212529;
            box-shadow: 0 0 0 0.2rem rgba(33, 37, 41, 0.15);
        }

        .login-btn {
            height: 48px;
            border-radius: 10px;
            font-weight: bold;
            transition: 0.3s;
        }

        .login-btn:hover {
            transform: translateY(-2px);
        }

        .register-link {
            color: #212529;
            font-weight: bold;
            text-decoration: none;
        }

        .register-link:hover {
            text-decoration: underline;
        }

        .brand {
            position: absolute;
            top: 25px;
            left: 30px;
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-decoration: none;
        }

        .flash-message {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 430px;
            z-index: 1050;
        }
    </style>
</head>

<body>

{% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
        <div class="flash-message">

            {% for category, message in messages %}

                <div class="alert alert-{{ category }} alert-dismissible fade show shadow">

                    {{ message }}

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="alert">
                    </button>

                </div>

            {% endfor %}

        </div>
    {% endif %}
{% endwith %}

<a href="/" class="brand">
    MyBlog
</a>

<div class="login-container">

    <div class="login-card">

        <div class="logo">
            ??
        </div>

        <div class="text-center mb-4">

            <h2 class="login-title">
                Welcome Back
            </h2>

            <p class="login-subtitle">
                Login to continue to MyBlog
            </p>

        </div>

        <form method="POST" action="/login">

            <div class="mb-3">

                <label class="form-label fw-semibold">
                    Email Address
                </label>

                <input
                    type="email"
                    name="email"
                    class="form-control"
                    placeholder="Enter your email"
                    required>

            </div>

            <div class="mb-4">

                <label class="form-label fw-semibold">
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    class="form-control"
                    placeholder="Enter your password"
                    required>

            </div>

            <button
                type="submit"
                class="btn btn-dark w-100 login-btn">
                Login
            </button>

        </form>

        <div class="text-center mt-4">

            <p class="text-muted mb-0">
                Don't have an account?

                <a href="/register" class="register-link">
                    Create Account
                </a>
            </p>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
