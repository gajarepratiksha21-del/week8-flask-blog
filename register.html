<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - MyBlog</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #212529, #495057);
            font-family: Arial, sans-serif;
        }

        .register-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 15px;
        }

        .register-card {
            width: 100%;
            max-width: 450px;
            background: white;
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
        }

        .logo {
            width: 70px;
            height: 70px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #212529;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
        }

        .register-title {
            font-weight: bold;
            color: #212529;
        }

        .register-subtitle {
            color: #6c757d;
            font-size: 14px;
        }

        .form-control {
            height: 48px;
            border-radius: 10px;
        }

        .form-control:focus {
            border-color: #212529;
            box-shadow: 0 0 0 0.2rem rgba(33, 37, 41, 0.15);
        }

        .register-btn {
            height: 48px;
            border-radius: 10px;
            font-weight: bold;
        }

        .brand {
            position: absolute;
            top: 25px;
            left: 30px;
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-decoration: none;
        }

        .login-link {
            color: #212529;
            font-weight: bold;
            text-decoration: none;
        }
    </style>
</head>

<body>

<a href="/" class="brand">MyBlog</a>

<div class="register-container">

    <div class="register-card">

        <div class="logo">
            ??
        </div>

        <div class="text-center mb-4">
            <h2 class="register-title">Create Account</h2>

            <p class="register-subtitle">
                Join MyBlog and share your ideas with the world
            </p>
        </div>

        <form method="POST" action="/register">

            <div class="mb-3">
                <label class="form-label fw-semibold">
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    class="form-control"
                    placeholder="Enter your username"
                    required>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">
                    Email Address
                </label>

                <input
                    type="email"
                    name="email"
                    class="form-control"
                    placeholder="Enter your email"
                    required>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    class="form-control"
                    placeholder="Create a password"
                    required>
            </div>

            <div class="mb-4">
                <label class="form-label fw-semibold">
                    Confirm Password
                </label>

                <input
                    type="password"
                    name="confirm_password"
                    class="form-control"
                    placeholder="Confirm your password"
                    required>
            </div>

            <button
                type="submit"
                class="btn btn-dark w-100 register-btn">
                Create My Account
            </button>

        </form>

        <div class="text-center mt-4">

            <p class="text-muted mb-0">
                Already have an account?
                <a href="/login" class="login-link">
                    Login
                </a>
            </p>

        </div>

    </div>

</div>

</body>
</html>
